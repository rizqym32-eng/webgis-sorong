<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGIS Kota Sorong — Pos Polisi & Pos Militer</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <!-- Leaflet JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Barlow:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #0b1423;
      --dark:   #111c2e;
      --panel:  #162035;
      --border: #1e3058;
      --police: #2563eb;
      --police-light: #60a5fa;
      --military: #16a34a;
      --military-light: #4ade80;
      --accent: #f59e0b;
      --text:   #e2e8f0;
      --muted:  #64748b;
    }

    html, body {
      height: 100%;
      font-family: 'Barlow', sans-serif;
      background: var(--navy);
      color: var(--text);
      overflow: hidden;
    }

    /* ── HEADER ── */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      background: linear-gradient(90deg, var(--navy) 0%, var(--dark) 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 56px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-badge {
      background: var(--accent);
      color: var(--navy);
      font-family: 'Teko', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 3px 8px;
      border-radius: 3px;
    }

    #header h1 {
      font-family: 'Teko', sans-serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #fff;
    }

    #header h1 span {
      color: var(--accent);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--military-light);
      display: inline-block;
      margin-right: 5px;
      box-shadow: 0 0 6px var(--military-light);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── MAP ── */
    #map {
      position: fixed;
      top: 56px; bottom: 0; left: 0; right: 0;
      z-index: 1;
    }

    /* ── LEGEND / PANEL ── */
    #legend {
      position: fixed;
      bottom: 24px;
      right: 16px;
      z-index: 1000;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      min-width: 200px;
      backdrop-filter: blur(8px);
    }

    #legend h3 {
      font-family: 'Teko', sans-serif;
      font-size: 15px;
      letter-spacing: 2px;
      color: var(--accent);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 400;
    }

    .legend-icon {
      width: 20px; height: 20px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.2);
    }

    .police-icon  { background: var(--police); box-shadow: 0 0 8px var(--police); }
    .military-icon { background: var(--military); box-shadow: 0 0 8px var(--military); }

    /* ── STAT BOX ── */
    #stats {
      position: fixed;
      top: 70px;
      right: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 12px;
      color: var(--muted);
      min-width: 160px;
    }

    .stat-card .stat-num {
      font-family: 'Teko', sans-serif;
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
      display: block;
    }

    .stat-card.police  .stat-num { color: var(--police-light); }
    .stat-card.military .stat-num { color: var(--military-light); }

    /* ── LOADING ── */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: var(--navy);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.5s;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading p {
      font-family: 'Teko', sans-serif;
      font-size: 16px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── LEAFLET POPUP OVERRIDE ── */
    .leaflet-popup-content-wrapper {
      background: var(--panel) !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px !important;
      color: var(--text) !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6) !important;
      font-family: 'Barlow', sans-serif !important;
    }

    .leaflet-popup-tip {
      background: var(--panel) !important;
    }

    .leaflet-popup-content {
      margin: 12px 16px !important;
      font-size: 13px !important;
      line-height: 1.6 !important;
    }

    .popup-title {
      font-family: 'Teko', sans-serif;
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .popup-title.police  { color: var(--police-light); }
    .popup-title.military { color: var(--military-light); }

    .popup-row {
      display: flex;
      gap: 6px;
      margin-bottom: 2px;
      font-size: 12px;
      color: var(--muted);
    }

    .popup-row strong {
      color: var(--text);
      min-width: 70px;
    }

    .leaflet-close-button-wrapper { display: none; }
    .leaflet-popup-close-button { color: var(--muted) !important; }

    /* ── ERROR BOX ── */
    .error-box {
      position: fixed;
      top: 70px;
      left: 16px;
      z-index: 1000;
      background: #7f1d1d;
      border: 1px solid #ef4444;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12px;
      max-width: 280px;
      display: none;
    }
  </style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading">
  <div class="spinner"></div>
  <p>Memuat data peta...</p>
</div>

<!-- Header -->
<div id="header">
  <div class="header-left">
    <span class="header-badge">WEBGIS</span>
    <h1>Kota <span>Sorong</span> — Pos Keamanan</h1>
  </div>
  <div class="header-right">
    <span><span class="dot"></span>OpenStreetMap</span>
    <span>Papua Barat Daya, Indonesia</span>
  </div>
</div>

<!-- Map -->
<div id="map"></div>

<!-- Stats -->
<div id="stats">
  <div class="stat-card police">
    <span class="stat-num" id="count-police">—</span>
    Pos Polisi
  </div>
  <div class="stat-card military">
    <span class="stat-num" id="count-military">—</span>
    Pos Militer
  </div>
</div>

<!-- Legend -->
<div id="legend">
  <h3>Legenda</h3>
  <div class="legend-item">
    <div class="legend-icon police-icon"></div>
    Pos Polisi
  </div>
  <div class="legend-item">
    <div class="legend-icon military-icon"></div>
    Pos Militer
  </div>
</div>

<!-- Error box -->
<div class="error-box" id="error-box"></div>

<script>
  // ── MAP INIT ──────────────────────────────────────────
  const map = L.map('map', {
    center: [-0.8617, 131.2520],   // Kota Sorong
    zoom: 13,
    zoomControl: true
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);

  // ── CUSTOM MARKER ICONS ───────────────────────────────
  function makeIcon(color, label) {
    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40">
        <defs>
          <filter id="sh">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.5)"/>
          </filter>
        </defs>
        <path d="M16 0C7.16 0 0 7.16 0 16c0 10 16 24 16 24S32 26 32 16C32 7.16 24.84 0 16 0z"
              fill="${color}" filter="url(#sh)"/>
        <circle cx="16" cy="16" r="8" fill="white" opacity="0.9"/>
        <text x="16" y="20.5" text-anchor="middle" font-family="Teko,sans-serif"
              font-size="10" font-weight="700" fill="${color}">${label}</text>
      </svg>`;
    return L.divIcon({
      html: svg,
      iconSize: [32, 40],
      iconAnchor: [16, 40],
      popupAnchor: [0, -42],
      className: ''
    });
  }

  const iconPolice   = makeIcon('#2563eb', 'POL');
  const iconMilitary = makeIcon('#16a34a', 'MIL');

  // ── POPUP BUILDER ─────────────────────────────────────
  function buildPopup(props, type) {
    const cls   = type === 'police' ? 'police' : 'military';
    const label = type === 'police' ? '🚔 Pos Polisi' : '🪖 Pos Militer';
    const name  = props.name || props.amenity || props.military || 'Tidak diketahui';
    const addr  = props['addr:full'] || props['addr:street'] || props.address || '—';
    const op    = props.operator || '—';
    const osm   = props.osm_id ? `<div class="popup-row"><strong>OSM ID</strong>${props.osm_id}</div>` : '';

    return `
      <div class="popup-title ${cls}">${label}</div>
      <div class="popup-row"><strong>Nama</strong>${name}</div>
      <div class="popup-row"><strong>Alamat</strong>${addr}</div>
      <div class="popup-row"><strong>Operator</strong>${op}</div>
      ${osm}
    `;
  }

  // ── GEOJSON LOADER ────────────────────────────────────
  let countPolice   = 0;
  let countMilitary = 0;

  function showError(msg) {
    const box = document.getElementById('error-box');
    box.style.display = 'block';
    box.innerHTML += `<div>⚠ ${msg}</div>`;
  }

  function loadGeoJSON(path, icon, type, onDone) {
    fetch(path)
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status} — ${path}`);
        return r.json();
      })
      .then(data => {
        const layer = L.geoJSON(data, {
          pointToLayer: (feature, latlng) => L.marker(latlng, { icon }),
          onEachFeature: (feature, layer) => {
            const p = feature.properties || {};
            layer.bindPopup(buildPopup(p, type), { maxWidth: 260 });
          }
        }).addTo(map);

        const count = data.features ? data.features.length : 0;
        onDone(count);
      })
      .catch(err => {
        console.error(err);
        showError(`Gagal memuat <b>${path}</b>. Pastikan file ada di folder <code>data/</code>.`);
        onDone(0);
      });
  }

  // ── LOAD DATA — nama file HARUS sama persis ───────────
  // Letakkan file GeoJSON kamu di:
  //   data/pos_polisi_sorong.geojson
  //   data/pos_militer_sorong.geojson

  let loaded = 0;
  function checkAllLoaded() {
    loaded++;
    if (loaded === 2) {
      document.getElementById('loading').classList.add('hidden');
    }
  }

  loadGeoJSON('data/pos_polisi_sorong.geojson', iconPolice, 'police', (n) => {
    countPolice = n;
    document.getElementById('count-police').textContent = n;
    checkAllLoaded();
  });

  loadGeoJSON('data/pos_militer_sorong.geojson', iconMilitary, 'military', (n) => {
    countMilitary = n;
    document.getElementById('count-military').textContent = n;
    checkAllLoaded();
  });
</script>
</body>
</html>
